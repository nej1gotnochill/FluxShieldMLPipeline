<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Netra — Passive One-Way Threat Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Netra SOC — design system
   Lime-on-black identity · flat · dense · calm by default
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  /* base surfaces */
  --bg: #050706;
  --panel: #111312;
  --panel2: #161816;
  --panel3: #1B1E1B;
  /* structure */
  --line: #222522;
  --line2: #292C29;
  /* text */
  --text: #F4F5F1;
  --text2: #A8ADA5;
  --text3: #737871;
  /* semantic */
  --red: #E15252;
  --amber: #E0A84A;
  --green: #A8D93F;
  --info: #A8ADA5;   /* neutralized — no cyan in the lime palette */
  --blue: #A8ADA5;   /* neutralized — legacy class name, neutral render */
  /* identity */
  --teal: #C9FF3F;
  --teal-bright: #D7FF63;
  --teal-dim: #343831;   /* neutralized — was a teal tint */
  --sand: #D6DAD2;
  /* motion */
  --t-fast: 120ms cubic-bezier(.3,.7,.4,1);
  --t-med: 220ms cubic-bezier(.3,.7,.4,1);
  /* typography */
  --sans: Inter, 'IBM Plex Sans', system-ui, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --serif: var(--sans);
  /* radius scale */
  --r1: 4px; --r2: 10px; --r3: 12px;
  /* elevation */
  --e1: 0 1px 4px rgba(0,0,0,.35);
  --e2: 0 6px 20px rgba(0,0,0,.45);
  --nav-w: 190px;
  --top-h: 46px;
  --fs-xs: 9px;
  --fs-sm: 10px;
  --fs-md: 11px;
  --fs-lg: 13px;
  /* 8px spacing scale */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
}
html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:var(--fs-md); overflow:hidden; }
body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(244,245,241,.03) 1px, transparent 1px);
  background-size:26px 26px; }
#app { position:relative; z-index:1; }
body { font-feature-settings:'tnum' 1; }
::-webkit-scrollbar { width:8px; height:8px; }
* { scrollbar-width:thin; scrollbar-color:var(--line2) transparent; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--line2); }
::-webkit-scrollbar-thumb:hover { background:#343831; }
::selection { background:rgba(201,255,63,.4); color:var(--text); }

/* ============ APP FRAME ============ */
#app { display:grid; grid-template-columns:var(--nav-w) 1fr; grid-template-rows:var(--top-h) 1fr; height:100vh; }
/* single header bar: brand + descriptor + page + status */
#brand { grid-column:1/3; grid-row:1; border-bottom:1px solid var(--line); padding:0 var(--s4); display:flex; align-items:center; gap:var(--s3); overflow:hidden; }
#brand .name { font-family:var(--sans); font-weight:700; font-size:15px; letter-spacing:.01em; color:var(--text); white-space:nowrap; flex:none; }
#brand .name em { font-style:normal; color:var(--teal-bright); }
#brand .tag { font-size:8px; letter-spacing:1.8px; color:var(--text3); text-transform:uppercase; white-space:nowrap; flex:none; }
#brand .divider { width:1px; height:18px; background:var(--line2); flex:none; }
@media (max-width:1240px){ #brand .tag, #brand .divider { display:none; } }
#nav { grid-column:1; grid-row:2; border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; background:var(--bg); gap:2px; padding:8px 0; }
#screens { grid-column:2; grid-row:2; overflow:hidden; position:relative; min-width:0; }

/* ============ TOP BAR ============ */
.tb-page { padding:0; flex:none; display:flex; align-items:center; font-family:var(--sans); font-weight:600; font-size:14px; color:var(--text); white-space:nowrap; letter-spacing:.01em; }
.tb-meta { flex:1; display:flex; align-items:center; overflow:hidden; }
.tb-meta .cell { padding:7px 14px; border-right:1px solid var(--line); min-width:0; }
.tb-meta .k { font-size:var(--fs-xs); letter-spacing:1.2px; color:var(--text3); text-transform:uppercase; white-space:nowrap; }
.tb-meta .v { font-size:var(--fs-sm); color:var(--text2); margin-top:1px; white-space:nowrap; }
.tb-status { display:flex; align-items:center; gap:10px; padding:0; margin-left:auto; font-size:var(--fs-xs); flex:none; }
.tb-status .grp { display:flex; align-items:center; gap:5px; letter-spacing:1px; white-space:nowrap; color:var(--text2); }
@keyframes dotpulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
.dot { width:5px; height:5px; background:var(--green); display:inline-block; }
.dot.off, .dot.red, .dot.amber { animation:none; }
.dot.amber { background:var(--amber); }
.dot.red { background:var(--red); }
.dot.off { background:var(--text3); }
.utc { color:var(--text3); letter-spacing:.5px; }

/* ============ NAV RAIL ============ */
.nav-item { display:flex; align-items:center; gap:8px; padding:6px 14px; font-size:var(--fs-md); color:var(--text2); cursor:pointer; white-space:nowrap; flex:none; border-radius:var(--r1); margin:1px 8px; transition:color var(--t-fast), background var(--t-fast); }
.nav-sec { font-family:var(--mono); font-size:8px; letter-spacing:1.8px; color:var(--text3); text-transform:uppercase; padding:12px 16px 4px; flex:none; user-select:none; }
.nav-sec:first-child { padding-top:4px; }
.nav-item .ico { font-family:var(--mono); font-weight:400; font-size:12px; color:var(--text3); width:18px; flex:none; text-align:center; line-height:1; transition:color var(--t-fast); }
.nav-item .lbl { transition:color var(--t-fast); }
.nav-item:hover { color:var(--text); background:var(--panel); }
.nav-item { box-shadow:inset 2px 0 0 transparent; }
.nav-item.active { background:rgba(201,255,63,.07); color:var(--text); box-shadow:inset 2px 0 0 var(--teal); }
.nav-item.active .ico { color:var(--teal); }
.nav-item.active:hover { background:rgba(201,255,63,.09); color:var(--text); }
.nav-spacer { flex:1; }
.nav-footer { border-top:1px solid var(--line); padding:10px 14px; flex:none; }
.nav-footer .sec { font-size:var(--fs-xs); letter-spacing:1.6px; color:var(--text3); margin-bottom:6px; }
.svc-row { display:flex; justify-content:space-between; align-items:center; font-size:var(--fs-sm); color:var(--text2); padding:2px 0; }
.svc-row .st { font-size:var(--fs-xs); letter-spacing:1px; color:var(--green); display:flex; align-items:center; gap:4px; }
#uptime { margin-top:8px; display:flex; justify-content:space-between; font-size:var(--fs-sm); color:var(--text3); letter-spacing:1px; }
#uptime .val { color:var(--text2); }

/* ============ SCREENS ============ */
.screen { position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto; background:var(--bg); }
.screen.active { display:flex; }
.pad { padding:var(--s4); }
.flexr { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.grow { flex:1; min-height:0; }

/* ============ PANELS ============ */
.panel { background:var(--panel); border:1px solid var(--line); margin-bottom:12px; transition:border-color var(--t-med); }
.panel:hover { border-color:#343831; }
.panel:last-child { margin-bottom:0; }
.panel-hd { display:flex; align-items:center; justify-content:space-between; padding:7px 12px; border-bottom:1px solid var(--line); gap:10px; min-height:30px; }
.panel-hd .t { font-family:var(--sans); font-weight:500; font-size:var(--fs-xs); letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; white-space:nowrap; display:flex; align-items:center; gap:8px; }
.panel-hd .t::before { content:''; width:6px; height:6px; background:rgba(201,255,63,.55); flex:none; transition:background var(--t-med); }
.panel:hover .panel-hd .t::before { background:var(--teal); }
.panel-hd .t b { color:var(--text2); font-weight:normal; }
.panel-hd .sub { font-size:var(--fs-xs); color:var(--text3); letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.panel-hd .right { display:flex; align-items:center; gap:6px; flex:none; }
.panel-bd { padding:12px; border-radius:0 0 var(--r2) var(--r2); }
.panel-bd.none { padding:0; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid2-1 { display:grid; grid-template-columns:2fr 1fr; gap:12px; }

/* ============ KPI STRIP ============ */
.kpi-strip { display:grid; grid-template-columns:repeat(7,1fr); }
.kpi-strip.seven { grid-template-columns:1.35fr repeat(6,1fr); }
.kpi-strip.five { grid-template-columns:repeat(5,1fr); }
.kpi-strip.four { grid-template-columns:repeat(4,1fr); }
.kpi-strip.six { grid-template-columns:repeat(6,1fr); }
.kpi { padding:10px 12px; border-right:1px solid var(--line); min-width:0; overflow:hidden; }
.kpi:last-child { border-right:none; }
.kpi .k { font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi .v { font-family:var(--sans); font-weight:600; font-size:22px; line-height:1; color:var(--text); white-space:nowrap; letter-spacing:-.01em; }
.kpi .v.md { font-size:18px; }
.kpi .u { font-size:var(--fs-sm); color:var(--text3); margin-left:2px; font-family:var(--mono); }
.kpi .s { font-size:var(--fs-xs); color:var(--text3); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi .v.red { color:var(--red); } .kpi .v.amber { color:var(--amber); }
.kpi .v.green { color:var(--green); } .kpi .v.blue { color:var(--blue); }

/* ============ TAGS ============ */
.tag { display:inline-flex; align-items:center; gap:4px; font-size:var(--fs-xs); letter-spacing:1px; padding:2px 6px; border:1px solid var(--line2); border-radius:var(--r1); color:var(--text2); text-transform:uppercase; white-space:nowrap; }
.tag.red { border-color:var(--red); color:var(--red); }
.tag.amber { border-color:var(--amber); color:var(--amber); }
.tag.green { border-color:var(--green); color:var(--green); }
.tag.blue { border-color:var(--blue); color:var(--blue); }
.tag.dim { border-color:var(--line2); color:var(--text3); }
.tag.solid-red { background:var(--red); color:var(--bg); border-color:var(--red); }
.tag.solid-amber { background:var(--amber); color:var(--bg); border-color:var(--amber); }
.tag.solid-green { background:var(--green); color:var(--bg); border-color:var(--green); }
.tag.solid-blue { background:var(--blue); color:var(--bg); border-color:var(--blue); }
.tag.lite-red { border-color:var(--red); color:var(--red); background:rgba(225,82,82,.12); }

/* ============ BUTTONS / TABS ============ */
.btn { display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:var(--fs-xs); letter-spacing:1px; padding:4px 9px; background:transparent; color:var(--text2); border:1px solid var(--line2); cursor:pointer; text-transform:uppercase; white-space:nowrap; transition:all var(--t-fast); }
.btn:hover { color:var(--teal-bright); border-color:var(--teal); background:rgba(201,255,63,.08); }
.btn:focus-visible { outline:1px solid var(--teal); outline-offset:1px; }
.btn:active { transform:translateY(1px); }
.btn.red { border-color:var(--red); color:var(--red); }
.btn.red:hover { background:var(--red); color:#050706; }
.btn.amber { border-color:var(--amber); color:var(--amber); }
.btn.amber:hover { background:var(--amber); color:#050706; }
.btn.green { border-color:var(--green); color:var(--green); }
.btn.green:hover { background:var(--green); color:#050706; }
.btn.blue { border-color:var(--info); color:var(--info); }
.btn.blue:hover { background:var(--info); color:#050706; }
.btn.active, .btn.on { background:rgba(201,255,63,.10); color:var(--teal-bright); border-color:rgba(201,255,63,.45); font-weight:600; }
.btn.active:hover, .btn.on:hover { color:var(--teal-bright); background:rgba(201,255,63,.16); border-color:var(--teal); }
.btn[disabled] { opacity:.35; cursor:not-allowed; pointer-events:none; }
.tabs { display:flex; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.tab { padding:6px 13px; font-family:var(--sans); font-weight:500; font-size:var(--fs-xs); letter-spacing:1px; color:var(--text3); cursor:pointer; border-right:1px solid var(--line); text-transform:uppercase; white-space:nowrap; transition:all var(--t-fast);  transition:color var(--t-fast), background var(--t-fast), box-shadow var(--t-fast); }
.tab:hover { color:var(--teal-bright); background:rgba(201,255,63,.06); }
.tab.active { color:var(--text); background:rgba(201,255,63,.06); box-shadow:inset 0 -2px 0 var(--teal); font-weight:600; }
.tab.active:hover { background:rgba(201,255,63,.09); }
.seg { display:flex; }
.seg .btn { border-right-width:0; }
.seg .btn:last-child { border-right-width:1px; }

/* ============ TABLES ============ */
.tbl { width:100%; border-collapse:collapse; font-size:var(--fs-sm); table-layout:fixed; }
.tbl th { text-align:left; font-size:var(--fs-xs); letter-spacing:1.2px; color:var(--text3); font-weight:normal; text-transform:uppercase; padding:5px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; white-space:nowrap; }
.tbl td { padding:5px 10px; border-bottom:1px solid #0A0C0A; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.tbl tr:hover td { background:var(--panel2); }
.tbl tr.sel td { background:#0F110F; }
.tbl .r { text-align:right; } .tbl .c { text-align:center; }
.scroll-tbl { overflow-y:auto; }
.txt-red { color:var(--red); } .txt-amber { color:var(--amber); }
.txt-green { color:var(--green); } .txt-blue { color:var(--blue); }
.txt-white { color:var(--text); } .txt-mut { color:var(--text2); } .txt-dim { color:var(--text3); }

/* ============ CHARTS ============ */
.chart-wrap { position:relative; }
.chart { display:block; width:100%; }
.legend { display:flex; gap:14px; font-size:var(--fs-xs); color:var(--text3); letter-spacing:.8px; align-items:center; flex-wrap:wrap; }
.legend .li { display:flex; align-items:center; gap:5px; text-transform:uppercase; white-space:nowrap; }
.legend .sw { width:12px; height:3px; display:inline-block; }
.legend .sw.dash { background:repeating-linear-gradient(90deg,#737871 0 3px,transparent 3px 6px); height:1px; }
.legend .sw.fill { width:12px; height:8px; background:rgba(201,255,63,.16); border:1px solid var(--teal); }
.legend .sw.thresh { width:12px; height:0; border-top:1px dashed var(--red); }

/* ============ KILL CHAIN ============ */
.kc { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.kc .stage { border:1px solid var(--line); min-height:58px; padding:6px 8px; background:var(--panel2); min-width:0; border-radius:var(--r1); }
.kc .stage .nm { font-size:var(--fs-xs); letter-spacing:1.2px; color:var(--text3); text-transform:uppercase; white-space:nowrap; }
.kc .stage .bar { height:4px; background:var(--panel3); margin-top:6px; }
.kc .stage .bar > i { display:block; height:100%; }
.kc .stage.obs { background:var(--panel2); border-color:#343831; }
.kc .stage.obs .bar > i { background:var(--sand); }
.kc .stage.cur { background:#1B1E1B; border-color:#343831; }
.kc .stage.cur .nm { color:var(--text); }
.kc .stage.cur .bar > i { background:var(--text); }
.kc .stage.fst { background:repeating-linear-gradient(45deg,#161816,#161816 5px,#0F110F 5px,#0F110F 10px); }
.kc .stage .tt { font-size:var(--fs-xs); color:var(--text2); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kc .stage .rk { font-size:var(--fs-xs); color:var(--red); white-space:nowrap; }
.kc-legend { display:flex; gap:16px; margin-top:8px; font-size:var(--fs-xs); color:var(--text3); letter-spacing:1px; flex-wrap:wrap; }
.kc-legend .li { display:flex; gap:5px; align-items:center; text-transform:uppercase; }
.kc-legend .sw { width:12px; height:8px; border:1px solid var(--line2); }
.kc-legend .sw.obs { background:var(--panel2); border-color:var(--sand); }
.kc-legend .sw.cur { background:#343831; border-color:#343831; }
.kc-legend .sw.fst { background:repeating-linear-gradient(45deg,#161816 0 3px,#0F110F 3px 6px); }

/* ============ STATE VECTOR / ATTRIBUTION ============ */
.sv-list { overflow-y:auto; }
.sv-row { display:grid; grid-template-columns:24px 104px 56px 1fr 44px; gap:6px; align-items:center; padding:2px 8px; font-size:var(--fs-xs); }
.sv-row:hover { background:var(--panel2); }
.sv-row .ix { color:var(--text3); }
.sv-row .nm { color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sv-row .nm.hot { color:var(--amber); }
.sv-row .w { color:var(--text3); text-align:right; }
.sv-row .bar { height:3px; background:var(--panel3); }
.sv-row .bar > i { display:block; height:100%; background:#D6DAD2; }
.sv-row .bar > i.neg { background:var(--blue); }
.sv-row .val { color:var(--text3); text-align:right; }

/* ============ FORECAST TREE ============ */
.ft-wrap { position:relative; overflow:hidden; }
.ft-wrap svg { display:block; width:100%; }
.ft-box { position:absolute; border:1px solid var(--line2); background:rgba(13,13,13,.96); padding:8px 10px; min-width:238px; cursor:pointer; }
.ft-box:hover { border-color:#343831; }
.ft-box.sel { border-color:var(--text2); }
.ft-box .head { display:flex; align-items:center; gap:8px; }
.ft-box .bid { font-family:var(--serif); font-size:14px; }
.ft-box .bid.red { color:var(--red); } .ft-box .bid.amber { color:var(--amber); } .ft-box .bid.dim { color:var(--text3); }
.ft-box .pct { font-size:var(--fs-sm); color:var(--text); }
.ft-box .pbar { flex:1; height:3px; background:var(--panel3); min-width:40px; }
.ft-box .pbar > i { display:block; height:100%; }
.ft-box .desc { font-size:var(--fs-sm); color:var(--text); margin-top:4px; }
.ft-box .meta { font-size:var(--fs-xs); color:var(--text3); margin-top:3px; }
.ft-box .meta b { color:var(--text2); font-weight:normal; }

/* ============ REPLAY ============ */
.rp-top { display:flex; align-items:flex-start; gap:18px; padding:9px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.rp-cap-name { font-family:var(--serif); font-size:15px; color:var(--text); white-space:nowrap; }
.rp-cap-sub { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; }
.rp-stat { min-width:70px; }
.rp-stat .k { font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); white-space:nowrap; }
.rp-stat .v { font-family:var(--serif); font-size:18px; margin-top:2px; white-space:nowrap; }
.rp-ctrls { display:flex; align-items:center; gap:6px; padding:8px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.rp-clock { font-family:var(--serif); font-size:17px; color:var(--text); min-width:74px; text-align:right; }
.rp-state { font-size:var(--fs-xs); letter-spacing:1px; color:var(--teal); animation:dotpulse 1.6s ease-in-out infinite; }
.rp-state.paused { color:var(--amber); animation:none; }
.timeline { padding:8px 14px 4px; }
.tl-head { display:flex; justify-content:space-between; font-size:var(--fs-xs); color:var(--text3); margin-bottom:4px; letter-spacing:.8px; }
.winrow td { padding:3px 10px !important; font-size:var(--fs-xs); background:var(--panel2); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.winrow td b { font-weight:normal; color:var(--text); }
.winrow.sel td { background:#0F110F; }
.rp-side { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.rp-side .sv { padding:10px 14px; border-bottom:1px solid var(--line); }
.rp-side .k { font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; }
.rp-side .v { font-family:var(--serif); font-size:26px; margin-top:2px; line-height:1.1; }
.rp-side .v.red { color:var(--red); } .rp-side .v.green { color:var(--green); } .rp-side .v.amber { color:var(--amber); }
.rp-side .s { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; }
.rp-kv { display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:var(--fs-sm); }
.rp-kv .k { color:var(--text3); }
.rp-kv .v { color:var(--text2); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rp-lattice { display:grid; grid-template-columns:repeat(9,1fr); gap:3px; padding:6px 0 2px; }
.rp-lattice i { display:block; height:16px; background:repeating-linear-gradient(45deg,#161616,#161616 2px,#111312 2px,#111312 4px); border:1px solid var(--line); }
.attr-row { display:grid; grid-template-columns:88px 1fr 44px; gap:8px; align-items:center; padding:2px 0; font-size:var(--fs-xs); }
.attr-row .nm { color:var(--text2); white-space:nowrap; overflow:hidden; }
.attr-row .bar { height:3px; background:var(--panel3); }
.attr-row .bar > i { display:block; height:100%; background:#D6DAD2; }
.attr-row .pc { color:var(--text3); text-align:right; }

/* ============ INCIDENTS ============ */
.inc-stats { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
.inc-stats .cell { padding:10px 14px; border-right:1px solid var(--line); }
.inc-stats .cell:last-child { border-right:none; }
.inc-stats .k { font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; }
.inc-stats .v { font-family:var(--serif); font-size:20px; margin-top:3px; }
.inc-stats .s { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; }
.inc-layout { display:grid; grid-template-columns:400px 1fr; flex:1; min-height:0; }
.inc-list { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.inc-detail { display:flex; flex-direction:column; min-height:0; overflow-y:auto; }
.inc-item { padding:9px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
.inc-item:hover { background:var(--panel2); }
.inc-item.sel { background:#0A0C0A; box-shadow:inset 2px 0 0 var(--text2); }
.inc-item .l1 { display:flex; align-items:center; gap:6px; }
.inc-item .id { font-family:var(--serif); font-size:13px; color:var(--text); }
.inc-item .pk { margin-left:auto; color:var(--red); font-size:var(--fs-sm); }
.inc-item .tech { font-size:var(--fs-sm); color:var(--text2); margin-top:2px; }
.inc-item .meta { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; }
.inc-hd { display:flex; align-items:flex-start; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
.inc-title { display:flex; align-items:center; gap:8px; font-family:var(--serif); font-size:17px; flex-wrap:wrap; }
.inc-meta-line { font-size:var(--fs-xs); color:var(--text3); margin-top:4px; }
.inc-meta-line b { color:var(--text2); font-weight:normal; }
.inc-acts { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.feed-row { display:grid; grid-template-columns:64px 1fr; gap:10px; padding:5px 14px; border-bottom:1px solid #0A0C0A; font-size:var(--fs-sm); }
.feed-row .ts { color:var(--text3); }

/* ============ ATTACK PATH ============ */
.apath { display:flex; align-items:center; padding:14px; overflow-x:auto; }
.apath .node { border:1px solid var(--line2); background:var(--panel2); min-width:132px; padding:7px 10px; flex:none; }
.apath .node .lbl { font-size:var(--fs-xs); letter-spacing:1.2px; color:var(--text3); text-transform:uppercase; }
.apath .node .lbl.red { color:var(--red); } .apath .node .lbl.amber { color:var(--amber); }
.apath .node .nm { font-size:var(--fs-sm); color:var(--text); margin-top:2px; }
.apath .node .ip { font-size:var(--fs-xs); color:var(--text2); }
.apath .node .x { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; }
.apath .node.hot { border-color:var(--red); }
.apath .node.warm { border-color:var(--amber); }
.apath .node.cool { border-color:var(--blue); }
.apath .link { width:34px; height:1px; background:var(--line2); flex:none; margin:0 4px; }
.apath .link.hot { background:var(--red); height:2px; }
.apath .link.warm { background:var(--amber); height:2px; }
.apath .link.dash { background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px); }
.apath .link.dash.hot { background:repeating-linear-gradient(90deg,var(--red) 0 4px,transparent 4px 8px); height:2px; }
.apath .link.dash.warm { background:repeating-linear-gradient(90deg,var(--amber) 0 4px,transparent 4px 8px); height:2px; }
.apath .xmeta { font-size:var(--fs-xs); color:var(--text3); margin:0 6px; white-space:nowrap; }

/* ============ NETWORK ============ */
.net-layout { display:grid; grid-template-columns:1fr 296px; flex:1; min-height:0; }
.net-canvas { position:relative; min-height:430px; overflow:hidden; }
.net-canvas svg { display:block; width:100%; height:100%; }
/* living topology: threat edges carry marching dashes toward the target */
.net-canvas .edge-hot { animation:dashFlow 1.1s linear infinite; }
.net-canvas .edge-warm { animation:dashFlow 1.7s linear infinite; }
.net-canvas .edge-tap { animation:dashFlow 2.8s linear infinite; }
@keyframes dashFlow { to { stroke-dashoffset:-16; } }
/* heartbeat ring around threatened cubes (SVG transform-box keeps the scale local) */
.net-canvas .cube-pulse { transform-box:fill-box; transform-origin:center; animation:cubePulse 2.6s ease-in-out infinite; }
@keyframes cubePulse { 0%,100% { opacity:0; transform:scale(.9); } 50% { opacity:.75; transform:scale(1.06); } }
.net-side { border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.net-side .hd { padding:8px 12px; border-bottom:1px solid var(--line); font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); }
.host-scroll { overflow-y:auto; }
.host-row { padding:6px 12px; border-bottom:1px solid #0A0C0A; cursor:pointer; }
.host-row:hover { background:var(--panel2); }
.host-row.sel { background:#0F110F; }
.host-row .l1 { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.host-row .nm { font-size:var(--fs-sm); color:var(--text); }
.host-row .ip { font-size:var(--fs-xs); color:var(--text3); }
.host-row .risk { font-size:var(--fs-xs); }
.host-row .meta { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; }
.net-legend { display:flex; gap:13px; padding:8px 14px; border-top:1px solid var(--line); font-size:var(--fs-xs); color:var(--text3); flex-wrap:wrap; }
.net-legend .li { display:flex; gap:5px; align-items:center; letter-spacing:.8px; text-transform:uppercase; white-space:nowrap; }
.net-legend .nd { width:8px; height:8px; border:1px solid var(--line2); flex:none; }
.net-legend .nd.n { background:#343831; }
.net-legend .nd.s { background:var(--amber); border-color:var(--amber); }
.net-legend .nd.h { background:var(--red); border-color:var(--red); }
.net-legend .nd.sv { background:#1B1E1B; }
.net-legend .nd.ws { background:var(--bg); }
.net-legend .nd.dmz { background:var(--bg); border-color:var(--text2); }
.net-legend .nd.crit { background:rgba(225,82,82,.14); border-color:var(--red); }
.net-legend .nd.tok { background:none; border:none; color:var(--text3); width:auto; height:auto; }

/* ============ MODEL ============ */
.ml-strip { display:grid; grid-template-columns:repeat(6,1fr); }
.ml-strip .cell { padding:10px 12px; border-right:1px solid var(--line); min-width:0; }
.ml-strip .cell:last-child { border-right:none; }
.ml-strip .k { font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; white-space:nowrap; }
.ml-strip .v { font-family:var(--serif); font-size:20px; margin-top:3px; white-space:nowrap; }
.ml-strip .s { font-size:var(--fs-xs); color:var(--text3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.early-row { display:grid; grid-template-columns:56px 1fr 130px 60px; gap:10px; align-items:center; padding:6px 12px; border-bottom:1px solid #0A0C0A; font-size:var(--fs-sm); }
.early-row .t { color:var(--text2); white-space:nowrap; }
.early-row .bar { height:5px; background:var(--panel3); }
.early-row .bar > i { display:block; height:100%; background:var(--green); }
.early-row .pct { text-align:right; color:var(--text); }
.conf-matrix { display:grid; grid-template-columns:110px 1fr 1fr; gap:3px; font-size:var(--fs-xs); align-items:center; }
.cm-cell { padding:14px 8px; text-align:center; font-size:var(--fs-sm); border:1px solid var(--line); }
.cm-hdr { color:var(--text3); letter-spacing:1px; text-align:center; text-transform:uppercase; }
.cm-ben { background:rgba(168,217,63,.10); color:var(--green); }
.cm-atk { background:rgba(225,82,82,.10); color:var(--red); }

/* ============ CONTROLS ============ */
.nt-banner { border:1px solid var(--green); background:rgba(168,217,63,.07); padding:14px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.nt-banner .big { font-family:var(--serif); font-size:19px; color:var(--green); letter-spacing:1px; white-space:nowrap; }
.nt-banner .sub { font-size:var(--fs-xs); color:var(--text2); letter-spacing:1px; }
.nt-banner .sub b { color:var(--green); font-weight:normal; }
.warn-strip { border:1px solid var(--amber); background:rgba(224,168,74,.08); padding:7px 14px; font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--amber); text-align:center; text-transform:uppercase; }
.sim-lattice { display:grid; grid-template-columns:repeat(4,1fr); }
.sim-cell { border-right:1px solid var(--line); padding:12px; min-width:0; }
.sim-cell:last-child { border-right:none; }
.sim-cell .nm { font-size:var(--fs-sm); letter-spacing:1px; color:var(--text2); text-transform:uppercase; white-space:nowrap; }
.sim-cell .d { font-size:var(--fs-xs); color:var(--text3); margin-top:4px; min-height:26px; }
.sim-cell .btn { margin-top:8px; }
.ar-row { display:grid; grid-template-columns:150px 1fr 80px; gap:10px; align-items:center; padding:4px 12px; font-size:var(--fs-xs); border-bottom:1px solid #0A0C0A; }
.ar-row .k { color:var(--text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ar-row .bar { height:4px; background:var(--panel3); }
.ar-row .bar > i { display:block; height:100%; }
.ar-row .delta { text-align:right; }

/* ============ PREDICTIONS ============ */
.pred-row { display:grid; grid-template-columns:36px 66px 1fr 60px 64px 84px; gap:10px; align-items:center; padding:6px 12px; border-bottom:1px solid #0A0C0A; font-size:var(--fs-sm); }
.pred-row.hdr { font-size:var(--fs-xs); color:var(--text3); letter-spacing:1.2px; text-transform:uppercase; }
.pred-row .tid { color:var(--amber); }
.pred-row .bar { height:4px; background:var(--panel3); }
.pred-row .bar > i { display:block; height:100%; }
.mv-row { display:flex; justify-content:space-between; gap:10px; padding:4px 12px; border-bottom:1px solid #0A0C0A; font-size:var(--fs-sm); }
.mv-row .k { color:var(--text3); white-space:nowrap; }
.mv-row .v { color:var(--text2); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ============ TOAST ============ */
#toast { position:fixed; bottom:14px; right:14px; z-index:99; display:flex; flex-direction:column; gap:8px; }
.toast-item { background:var(--panel2); border:1px solid var(--line2); border-left:2px solid var(--teal); border-radius:var(--r2); box-shadow:var(--e2); padding:8px 12px; font-size:var(--fs-sm); color:var(--text2); min-width:250px; max-width:380px; transition:opacity 300ms ease; }
.toast-item.amber { border-left-color:var(--amber); }
.toast-item.red { border-left-color:var(--red); }
.toast-item .tt { color:var(--text); }

/* ============ LIVE PULSE ACCENTS ============ */
.scanline { position:absolute; left:0; right:0; top:0; height:1px; background:rgba(201,255,63,.45); pointer-events:none; animation:scanY 7s linear infinite; opacity:.7; }
@keyframes scanY { 0% { top:0; opacity:0; } 6% { opacity:.7; } 94% { opacity:.7; } 100% { top:calc(100% - 1px); opacity:0; } }
.scan { position:relative; display:inline-block; width:26px; height:6px; margin-right:2px; background:
  linear-gradient(90deg, transparent 0 40%, rgba(201,255,63,.55) 40% 55%, transparent 55%) left center/26px 1px no-repeat,
  linear-gradient(90deg, transparent 0 20%, rgba(201,255,63,.3) 20% 35%, transparent 35%) left 3px center/26px 1px no-repeat;
  animation:scanSlide 3.4s linear infinite; }
@keyframes scanSlide { 0% { background-position-x:26px, 26px; opacity:.2; } 50% { opacity:1; } 100% { background-position-x:-26px, -26px; opacity:.2; } }
.chart-wrap, .panel-bd { position:relative; }
.tv { font-weight:normal; }
.tb-status .grp .dot { box-shadow:none; }
.ft-box.sel { border-color:var(--teal); }
.nav-item.active { background:rgba(201,255,63,.07); box-shadow:inset 2px 0 0 var(--teal); color:var(--text); }
.nav-item.active:hover { background:rgba(201,255,63,.07); box-shadow:inset 2px 0 0 var(--teal); }
.tag.blue { border-color:var(--teal); color:var(--teal); }
.tag.lite-red { border-color:var(--red); color:var(--red); background:rgba(225,82,82,.12); }

/* ============ MISC ============ */
.hint { padding:6px 12px; font-size:var(--fs-xs); color:var(--text3); border-top:1px solid var(--line); letter-spacing:.5px; }
.smallcaps { font-size:var(--fs-xs); letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; }
.mt8 { margin-top:8px; } .mt12 { margin-top:12px; }
.hidden { display:none !important; }

/* ============ REFERENCE DNA OVERRIDES ============ */
.tb-status .grp { font-size:9px; }
.pill { font-size:9px; letter-spacing:1.2px; padding:3px 10px; border:1px solid var(--line2); border-radius:var(--r1); color:var(--text3); white-space:nowrap; }
.pill.amber { border-color:var(--amber); color:var(--amber); background:rgba(224,168,74,.08); }
.pill.green { border-color:var(--green); color:var(--green); background:rgba(168,217,63,.08); }
.pill.red { border-color:var(--red); color:var(--red); background:rgba(225,82,82,.10); }
.pill.solid-amber { background:var(--amber); border-color:var(--amber); color:var(--bg); }
.pill.ink { background:var(--text); color:var(--bg); border-color:var(--text); }
.pill.lime { background:var(--teal); border-color:var(--teal); color:#0A0C0A; font-weight:600; }
.pill.lite { border-color:transparent; }

/* Verdict (Overview top) */
.verdict { display:grid; grid-template-columns:240px 1fr 270px; }
.verdict > div { padding:12px 16px 14px; border-right:1px solid var(--line); min-width:0; }
.verdict > div:last-child { border-right:none; }
.verdict .k { font-size:var(--fs-xs); letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; }
.verdict .big { font-family:var(--serif); font-size:42px; line-height:1.05; margin-top:6px; }
.verdict .big.red { color:var(--red); }
.verdict .big.amber { color:var(--amber); }
.verdict .big.green { color:var(--green); }
.verdict .big .u { font-size:18px; color:var(--text3); }
/* ============ GAUGES / BARS ============ */
.gauge { height:5px; background:var(--panel3); position:relative; border-radius:var(--r1); overflow:hidden; }
.gauge > i { display:block; height:100%; background:var(--text2); transition:width 300ms cubic-bezier(.3,.7,.4,1); }
.gauge.red > i { background:var(--red); }
.gauge.amber > i { background:var(--amber); }
.gauge.green > i { background:var(--green); }
.gauge.teal > i { background:var(--teal); }
.gauge .mark { position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--text3); }
.verdict .gauge { margin-top:10px; }
.verdict .ticks { display:flex; justify-content:space-between; font-size:9px; color:var(--text3); margin-top:3px; letter-spacing:.5px; }
.verdict .tech { font-family:var(--serif); font-size:19px; margin-top:8px; }
.verdict .tech .tid { font-size:13px; }
.verdict .tactic { font-size:var(--fs-sm); color:var(--text2); margin-top:3px; letter-spacing:.5px; }
.verdict .desc { font-size:var(--fs-sm); color:var(--text3); margin-top:8px; }
.verdict .kv { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px solid var(--line); font-size:var(--fs-xs); letter-spacing:1.2px; text-transform:uppercase; }
.verdict .kv:last-child { border-bottom:none; }
.verdict .kv .kk { color:var(--text3); }
.verdict .kv .vv { color:var(--text); }
.verdict .kv .vv.red { color:var(--red); } .verdict .kv .vv.amber { color:var(--amber); }

/* Kill chain reference style */
.kc2 { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.kc2 .stage { min-width:0; }
.kc2 .nm { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; padding-bottom:5px; border-bottom:1px solid var(--line); }
.kc2 .nm.now { color:var(--text); }
.kc2 .track { height:12px; margin-top:6px; background:var(--panel3); position:relative; }
.kc2 .track > .obs { position:absolute; inset:0; background:var(--sand); }
.kc2 .track > .cur { position:absolute; inset:0; background:var(--teal); }
.kc2 .track > .fst { position:absolute; inset:0; background:repeating-linear-gradient(45deg,#161816 0 3px,#0F110F 3px 6px); }
.kc2 .track > .none { position:absolute; inset:0; background:var(--panel3); }
.kc2 .stage .info { font-size:9px; color:var(--text2); margin-top:6px; line-height:1.5; letter-spacing:.5px; }
.kc2 .stage .info .rk { color:var(--red); }
.kc2 .stage .info .mut { color:var(--text3); }
.kc-legend2 { display:flex; gap:18px; margin-top:10px; font-size:9px; color:var(--text3); letter-spacing:1px; text-transform:uppercase; }
.kc-legend2 .li { display:flex; align-items:center; gap:6px; }
.kc-legend2 .sw { width:12px; height:8px; }
.kc-legend2 .sw.obs { background:var(--sand); }
.kc-legend2 .sw.cur { background:var(--teal); }
.kc-legend2 .sw.fst { background:repeating-linear-gradient(45deg,#161816 0 3px,#0F110F 3px 6px); }

/* Early warning */
.early { display:grid; grid-template-columns:190px 1fr 250px; align-items:center; border-left:2px solid var(--green); background:var(--panel); }
.early .ew-num { padding:14px 20px; border-right:1px solid var(--line); }
.early .ew-num .k { font-size:var(--fs-xs); letter-spacing:1.6px; color:var(--text3); }
.early .ew-num .v { font-family:var(--serif); font-size:40px; color:var(--green); line-height:1.1; }
.early .ew-num .v .u { font-size:18px; }
.early .ew-mid { padding:14px 20px; }
.early .ew-mid .t { font-family:var(--serif); font-size:16px; }
.early .ew-mid .s { font-size:var(--fs-xs); color:var(--text3); margin-top:4px; letter-spacing:.5px; }
.early .ew-right { padding:14px 20px; border-left:1px solid var(--line); }
.early .ew-right .kv { display:flex; justify-content:space-between; padding:3px 0; font-size:9px; letter-spacing:1.2px; text-transform:uppercase; }
.early .ew-right .kv .k { color:var(--text3); }
.early .ew-right .kv .v { color:var(--text2); }

/* Telemetry strip */
.telem { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.telem .cell { padding:10px 14px; border-right:1px solid var(--line); min-width:0; }
.telem .cell:last-child { border-right:none; }
.telem .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; }
.telem .v { font-family:var(--serif); font-size:21px; margin-top:4px; }
.telem .v.red { color:var(--red); }
.telem .u { font-size:9px; color:var(--text3); margin-left:3px; }
.telem .s { font-size:9px; color:var(--text3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Attack strip (forecast stage) */
.astrip { display:flex; align-items:stretch; border-bottom:1px solid var(--line); }
.astrip .left { width:250px; padding:10px 16px; border-right:1px solid var(--line); flex:none; }
.astrip .left .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; display:flex; align-items:center; gap:6px; }
.astrip .left .k .rr { margin-left:auto; }
.astrip .left .tt { font-family:var(--serif); font-size:18px; margin-top:3px; }
.astrip .left .tt .red { color:var(--red); }
.astrip .left .s { font-size:9px; color:var(--text3); margin-top:3px; letter-spacing:.5px; }
.astrip .rail { flex:1; padding:8px 20px; min-width:0; }
.astrip svg { display:block; width:100%; height:100%; }

/* Forecast tree */
.ft-stage { position:relative; height:470px; background:var(--panel); overflow:hidden; }
.ft-stage svg { display:block; width:100%; height:100%; }
.ft-abs { position:absolute; }
.ft-abs .ft-box { cursor:pointer; }

/* Replay */
.rp-stats { display:flex; gap:34px; margin-left:auto; align-items:flex-start; }
.rp-stats .cell { text-align:right; min-width:86px; }
.rp-stats .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; }
.rp-stats .v { font-family:var(--serif); font-size:19px; margin-top:3px; }
.rp-stats .v.red { color:var(--red); }
.rp-stats .s { font-size:9px; color:var(--text3); margin-top:2px; }
.rp-clockbig { font-family:var(--serif); font-size:24px; min-width:110px; text-align:right; }
.rp-capture-name { font-family:var(--serif); font-size:17px; }
.rp-capmeta { font-size:9px; color:var(--text3); margin-top:3px; letter-spacing:.5px; }
.win-head { background:var(--panel2); border-top:1px solid var(--line); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:4px 12px; font-size:9px; letter-spacing:.8px; color:var(--text3); flex-wrap:wrap; }
.win-head b { color:var(--text); font-weight:normal; }
.win-head .rk { color:var(--red); }
.win-head .am { color:var(--amber); }
.flow-tbl td { font-size:10px; padding:3px 10px; }
.flow-tbl td.fid { color:var(--text3); }
.flow-tbl tr.path td:first-child { box-shadow:inset 2px 0 0 var(--red); }
.rp-lattice { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; padding:8px 0 2px; }
.rp-lattice i { display:block; height:18px; background:repeating-linear-gradient(45deg,#161816 0 2px,#0F110F 2px 4px); border:1px solid rgba(201,255,63,.25); }
.attr-row { display:grid; grid-template-columns:100px 1fr 46px; gap:8px; align-items:center; padding:3px 0; font-size:9px; }
.attr-row .nm { color:var(--text2); white-space:nowrap; overflow:hidden; }
.attr-row .nm.hot { color:var(--sand); }
.attr-row .bar { height:3px; background:var(--panel3); position:relative; }
.attr-row .bar > i { position:absolute; inset:0 auto 0 0; background:var(--sand); }
.attr-row .pc { color:var(--text3); text-align:right; }
.rp-side { border-left:1px solid var(--line); width:268px; flex:none; display:flex; flex-direction:column; overflow-y:auto; }
.rp-side .sv { padding:10px 14px; border-bottom:1px solid var(--line); }
.rp-side .sv .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; }
.rp-side .sv .v { font-family:var(--serif); font-size:20px; margin-top:3px; line-height:1.05; }
.rp-side .sv .v.red { color:var(--red); } .rp-side .sv .v.green { color:var(--green); }
.rp-side .sv .v.amber { color:var(--amber); } .rp-side .sv .v.off { color:var(--text3); }
.rp-side .sv .s { font-size:9px; color:var(--text3); margin-top:2px; }
.rp-side .kv { display:flex; justify-content:space-between; gap:8px; padding:4px 14px; font-size:9px; letter-spacing:1.2px; text-transform:uppercase; }
.rp-side .kv .k { color:var(--text3); }
.rp-side .kv .v { color:var(--text2); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Incidents */
.inc-stats .v.green { color:var(--green); }
.inc-stats .v.red { color:var(--red); }
.inc-stats .v.serif { font-family:var(--serif); }
.inc-item .tags { display:flex; gap:6px; align-items:center; }
.inc-item .l1 .right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.inc-detail-hd { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.inc-detail-hd .ttl { font-family:var(--serif); font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.inc-detail-hd .peak { margin-left:auto; font-size:9px; letter-spacing:1.2px; color:var(--text3); text-transform:uppercase; align-self:center; }
.inc-detail-hd .peak b { color:var(--red); font-weight:normal; font-family:var(--serif); font-size:14px; letter-spacing:0; margin-left:5px; }
.inc-line { font-size:10px; color:var(--text3); margin-top:4px; letter-spacing:.3px; }
.inc-line b { color:var(--text2); font-weight:normal; }
.inc-line .lead { color:var(--green); }

/* Blast radius diagram */
.blast { position:relative; height:330px; background:var(--panel); overflow:hidden; }
.blast svg { display:block; width:100%; height:100%; }
.bnode { position:absolute; border:1px solid var(--line2); background:rgba(13,13,13,.97); padding:7px 10px; min-width:150px; }
.bnode .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; display:flex; gap:6px; align-items:center; }
.bnode .k.red { color:var(--red); } .bnode .k.amber { color:var(--amber); }
.bnode .nm { font-family:var(--serif); font-size:13px; margin-top:3px; }
.bnode .ip { font-size:10px; color:var(--text2); }
.bnode .s { font-size:9px; color:var(--text3); margin-top:2px; }
.bnode.hot { border-top:2px solid var(--red); }
.bnode.warm { border-top:2px solid var(--amber); }
.bnode.tgt { border-top:2px solid var(--red); }

/* Investigation header row */
.inv-kpis { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
.inv-kpis .cell { padding:9px 14px; border-right:1px solid var(--line); min-width:0; }
.inv-kpis .cell:last-child { border-right:none; }
.inv-kpis .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; }
.inv-kpis .v { font-family:var(--serif); font-size:20px; margin-top:3px; }
.inv-kpis .v.green { color:var(--green); }
.inv-kpis .v.red { color:var(--red); }
.inv-kpis .s { font-size:9px; color:var(--text3); margin-top:2px; }
.rulebox { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.rulebox .cell .k { font-size:9px; letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; }
.rulebox .cell .v { font-family:var(--serif); font-size:19px; margin-top:2px; }
.rulebox .cell .v.red { color:var(--red); }
.rulebox .cell .v.green { color:var(--green); }
.rulebox .cell .v.off { color:var(--text3); }
.rulebox .cell .s { font-size:9px; color:var(--text3); margin-top:2px; }

/* Network */
.net-kpis { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
.net-kpis .cell { padding:9px 14px; border-right:1px solid var(--line); }
.net-kpis .cell:last-child { border-right:none; }
.net-kpis .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; }
.net-kpis .v { font-family:var(--serif); font-size:20px; margin-top:3px; }
.net-kpis .v.amber { color:var(--amber); }
.net-kpis .v.red { color:var(--red); }
.net-kpis .v.green { color:var(--green); }
.net-kpis .s { font-size:9px; color:var(--text3); margin-top:2px; }
.host-row .rbar { height:2px; background:var(--panel3); margin-top:4px; }
.host-row .rbar > i { display:block; height:100%; }

/* ATT&CK matrix */
.tactics { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.tactics .col { min-width:0; }
.tactics .th { font-size:9px; letter-spacing:1.2px; color:var(--text3); text-transform:uppercase; padding-bottom:5px; border-bottom:1px solid var(--line); }
.tech-cell { border:1px solid var(--line); padding:5px 7px; margin-top:6px; font-size:9px; color:var(--text2); background:var(--panel2); }
.tech-cell .tid { letter-spacing:.5px; }
.tech-cell .tn { color:var(--text3); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tech-cell.hot { border-color:var(--red); color:var(--red); background:rgba(225,82,82,.07); }
.tech-cell.warm { border-color:var(--amber); color:var(--amber); background:rgba(224,168,74,.06); }
.tech-cell .pr { margin-top:4px; height:3px; background:var(--panel3); }
.tech-cell .pr > i { display:block; height:100%; }

/* Controls */
.nt-grid { display:grid; grid-template-columns:230px 1fr 200px; align-items:center; }
.nt-grid .cell { padding:14px 16px; border-right:1px solid var(--line); }
.nt-grid .cell:last-child { border-right:none; }
.nt-grid .big { font-family:var(--serif); font-size:20px; color:var(--green); letter-spacing:.5px; }
.nt-grid .k { font-size:9px; letter-spacing:1.6px; color:var(--text3); text-transform:uppercase; margin-bottom:3px; }
.nt-grid .s { font-size:9px; color:var(--text2); letter-spacing:.5px; margin-top:2px; }
.nt-grid .s b { color:var(--green); font-weight:normal; }
.ar-delta .dneg { color:var(--green); }
.ar-delta .dneu { color:var(--text3); }

/* Events feed */
.evt-row { display:grid; grid-template-columns:150px 90px 110px 1fr 90px; gap:10px; padding:5px 14px; border-bottom:1px solid #0A0C0A; font-size:10px; color:var(--text2); align-items:center; }
.evt-row .ts { color:var(--text3); }
.evt-row .sev { letter-spacing:1px; font-size:9px; text-transform:uppercase; }
.evt-row .src { color:var(--text3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.evt-row .msg { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Predictions */
.pred-row .conf { font-family:var(--serif); font-size:12px; }

/* Camera status row (top-right) */
.cam-warn { display:flex; flex-direction:column; gap:4px; align-items:flex-end; }

/* misc */
.tnum { font-variant-numeric:tabular-nums; }
.nowrap { white-space:nowrap; }

/* ============================================================
   RESPONSIVE + ADAPTIVE LAYER
   Fluid 640px → ultrawide. Content caps at 2000px and centers
   on very large displays; rails and splits collapse in steps.
   ============================================================ */

/* ---- fluid shell + page scroll model ---- */
#app { grid-template-columns:minmax(var(--nav-w),auto) minmax(0,1fr); }
#screens { overflow-x:hidden; overflow-y:auto; }
.screen { position:static; min-height:100%; overflow:visible; }
.screen.active { display:flex; flex-direction:column; }

/* ---- ultrawide: cap content measure and center ---- */
.screen > .pad, .screen > .panel, .screen > .greet, .screen > .ov-metrics,
.screen > .band-2-1, .screen > .band-1-1, .screen > .ev-wrap {
  width:100%; max-width:2000px; margin-left:auto; margin-right:auto;
}

/* ---- replay split: class-driven so it can reflow ---- */
.rp-split { flex:1; display:flex; min-height:0; margin:12px; padding-top:0; }

/* ---- wide ≥1600: give splits more rail room ---- */
@media (min-width:1600px) {
  .band-2-1 { grid-template-columns:1.6fr 1fr; }
  .ev-split { grid-template-columns:1fr 400px; }
  .inc-layout { grid-template-columns:440px 1fr; }
  .net-layout { grid-template-columns:1fr 320px; }
  .rp-side { width:300px; }
  .netfield-wrap { height:460px; }
}

/* ---- ultrawide ≥2000: larger gutters, taller field ---- */
@media (min-width:2000px) {
  .pad { padding:24px; }
  .band-2-1, .band-1-1, .ov-metrics, .grid2, .grid2-1 { gap:16px; }
  .panel { margin-bottom:16px; }
}

/* ---- ≤1180: side rails fold under their primary panels ---- */
@media (max-width:1180px) {
  .band-2-1, .band-1-1, .ev-split, .inc-layout, .net-layout { grid-template-columns:1fr; }
  .inc-list { border-right:none; border-bottom:1px solid var(--line); max-height:320px; overflow-y:auto; }
  .net-side { border-left:none; border-top:1px solid var(--line); max-height:380px; }
  .rp-split { flex-direction:column; }
  .rp-side { width:auto; border-left:none; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); }
  .rp-side .sv, .rp-side .kv { border-bottom:1px solid var(--line); }
  .exec-body { grid-template-columns:1fr; }
  .exec-body > div:first-child { border-right:none; border-bottom:1px solid var(--line); }
  /* forecast: absolute branch boxes become a readable stack, tree as backdrop */
  .ft-stage { height:auto; min-height:430px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .ft-stage svg { position:absolute; inset:0; width:100%; height:100%; opacity:.35; }
  .ft-box { position:static; min-width:0; }
  .early { grid-template-columns:150px 1fr; }
  .early .ew-right { grid-column:1/-1; border-left:none; border-top:1px solid var(--line); }
}

/* ---- ≤1080: icon-only nav rail with hover labels ---- */
@media (max-width:1080px) {
  :root { --nav-w:56px; }
  .nav-sec { display:none; }
  .nav-item { position:relative; justify-content:center; padding:9px 8px; margin:1px 5px; }
  .nav-item .lbl { display:none; }
  .nav-item:hover .lbl, .nav-item:focus-visible .lbl {
    display:block; position:absolute; left:calc(100% + 8px); top:50%; transform:translateY(-50%);
    background:#0A0C0A; border:1px solid var(--line2); border-radius:var(--r1);
    color:var(--text); padding:4px 9px; font-size:10px; letter-spacing:1px; white-space:nowrap; z-index:60;
  }
  .nav-footer { padding:10px 8px; }
  .nav-footer .sec, .svc-row, #uptime { display:none; }
}

/* ---- ≤980: quieter header, adaptive stat strips ---- */
@media (max-width:980px) {
  #brand .tag { display:none; }
  .tb-status .grp:not(.utc) { display:none; }
  .telem { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .ml-strip { grid-template-columns:repeat(3,1fr); }
  .ml-strip .cell { border-bottom:1px solid var(--line); }
  .kc2 { grid-template-columns:repeat(4,1fr); row-gap:16px; }
  .tactics { grid-template-columns:repeat(4,1fr); row-gap:16px; }
  .astrip { flex-direction:column; }
  .astrip .left { width:auto; border-right:none; border-bottom:1px solid var(--line); }
  .netfield-wrap { height:340px; }
  .inc-stats { grid-template-columns:repeat(2,1fr); }
  .inc-stats .cell { border-bottom:1px solid var(--line); }
}

/* ---- ≤860: nav becomes a horizontal scroller under the header ---- */
@media (max-width:860px) {
  #app { grid-template-columns:1fr; grid-template-rows:var(--top-h) auto minmax(0,1fr); }
  #brand { grid-column:1; }
  #nav { grid-column:1; grid-row:2; width:auto; flex-direction:row; align-items:center;
    overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--line);
    padding:0 8px; scrollbar-width:none; }
  #nav::-webkit-scrollbar { display:none; }
  .nav-item { flex:none; }
  .nav-sec { display:none; }
  .nav-item .lbl { display:inline; }
  .nav-item:hover .lbl, .nav-item:focus-visible .lbl { display:inline; position:static; transform:none;
    background:none; border:none; padding:0; }
  .nav-spacer, .nav-footer { display:none; }
  #screens { grid-column:1; grid-row:3; }
}

/* ---- ≤760: tables scroll horizontally instead of crushing ---- */
@media (max-width:760px) {
  .tbl { display:block; overflow-x:auto; white-space:nowrap; table-layout:auto; }
  .tbl th { position:static; }
  .flow-tbl { min-width:720px; }
}

/* ---- ≤640: compact everything ---- */
@media (max-width:640px) {
  .pad { padding:8px; }
  #brand { gap:8px; padding:0 10px; }
  .tb-status .grp.utc { font-size:8.5px; }
  .exec-btn { margin-left:0; }
  .greet { padding-bottom:10px; }
  .greet .g-t { font-size:19px; }
  .kpi .v { font-size:17px; }
  .mcard { padding:12px 14px; }
  .mcard .v { font-size:24px; }
  .ov-metrics { grid-template-columns:1fr 1fr; gap:8px; }
  .ov-metrics .mcard:first-child { grid-column:1/-1; }
  .netfield-wrap { height:260px; }
  .verdict { grid-template-columns:1fr; }
  .verdict > div { border-right:none; border-bottom:1px solid var(--line); }
  .verdict > div:last-child { border-bottom:none; }
  .inv-kpis, .net-kpis { grid-template-columns:1fr 1fr; }
  .inv-kpis .cell, .net-kpis .cell { border-bottom:1px solid var(--line); }
  .sim-lattice { grid-template-columns:1fr 1fr; }
  .sim-cell { border-bottom:1px solid var(--line); }
  .nt-grid { grid-template-columns:1fr; }
  .nt-grid .cell { border-right:none; border-bottom:1px solid var(--line); }
  .conf-matrix { grid-template-columns:80px 1fr 1fr; }
  .evt-row { grid-template-columns:60px 76px 1fr 70px; }
  .evt-row > span:nth-child(3) { display:none; }
  .rp-ctrls { gap:4px; }
  .rp-clockbig { font-size:18px; min-width:84px; }
  .early { grid-template-columns:1fr; }
  .early .ew-num { border-right:none; border-bottom:1px solid var(--line); }
}

/* ---- touch: larger hit targets ---- */
@media (pointer:coarse) {
  .btn, .tab { min-height:30px; }
  .nav-item { min-height:34px; }
  .tl-node { width:13px; height:13px; top:-6px; }
  .tl-node.now { height:21px; top:-11px; }
  .tbl td { padding-top:8px; padding-bottom:8px; }
}

/* ---- narrow+coarse: don't hide the hover-only nav labels ---- */
@media (max-width:1080px) and (pointer:coarse) {
  .nav-item .lbl { display:none; }
  .nav-item:hover .lbl, .nav-item:focus-visible .lbl { display:none; }
}

/* ============================================================
   TYPE ROLES — sans for display, mono for telemetry
   ============================================================ */
#brand .name, .tb-page, .panel-hd .t b, .kpi .v, .verdict .big, .verdict .tech,
.kc2 .nm, .telem .v, .inc-stats .v, .inc-detail-hd .ttl, .inc-title,
.bnode .nm, .inv-kpis .v, .net-kpis .v, .rulebox .cell .v, .ml-strip .v,
.rp-side .sv .v, .rp-clockbig, .rp-capture-name, .rp-stats .v, .nt-grid .big,
.early .ew-num .v, .early .ew-mid .t, .ft-box .bid, .verdict .kv .vv,
.apath .node .nm, .host-row .nm, .inc-item .id, .kpi-strip .v { font-family:var(--sans); font-weight:600; letter-spacing:0; }
.verdict .big, .kpi .v, .telem .v, .rp-side .sv .v, .inv-kpis .v, .net-kpis .v,
.inc-stats .v, .fc .n { font-weight:500; font-variant-numeric:tabular-nums; }
.kpi .k, .telem .k, .panel-hd .t, .smallcaps, .lbl, .tb-meta .k, .kc-legend2, .net-legend .li,
.verdict .k, .verdict .kv .kk, .early .ew-num .k, .inc-stats .k, .inv-kpis .k, .net-kpis .k,
.ml-strip .k, .rulebox .cell .k, .nt-grid .k, .rp-side .sv .k, .rp-side .kv .k,
.rp-stats .k, .hm .k, .kpi .s, .telem .s { font-family:var(--mono); }
.tbl, .evt-row, .sv-row, .ar-row, .pred-row, .feed-row, .mv-row, .tick-labels,
.flow-tbl, .win-head, .early-row, .attr-row, .dg-ticks { font-family:var(--mono); }

/* ============================================================
   UX REFINEMENT — field context, overview hierarchy, events,
   progressive model evidence
   ============================================================ */
.field-ctx { border-top:1px solid var(--line); padding:8px 14px; display:flex; align-items:baseline; gap:12px; font-size:var(--fs-sm); min-height:34px; background:var(--panel); }
.field-ctx .fc-k { font-family:var(--mono); font-size:8.5px; letter-spacing:1.4px; color:var(--teal); text-transform:uppercase; flex:none; }
.field-ctx .fc-v { color:var(--text2); }
.field-ctx .fc-v b { color:var(--text); font-weight:600; }
.field-ctx .fc-x { margin-left:auto; font-family:var(--mono); font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; }

.ov-metrics { display:grid; grid-template-columns:1.6fr repeat(4,1fr); gap:12px; margin-bottom:12px; }
.ov-metrics .mcard { margin-bottom:0; padding:14px 16px; }
.mcard .t { font-family:var(--sans); font-weight:600; font-size:15px; color:var(--text); margin-top:8px; line-height:1.35; }
.mcard .t .tid { font-family:var(--mono); font-weight:400; font-size:11px; color:var(--red); display:block; letter-spacing:.5px; }
.mcard .meta { display:flex; gap:14px; flex-wrap:wrap; font-family:var(--mono); font-size:9px; color:var(--text3); margin-top:8px; letter-spacing:.4px; text-transform:uppercase; }
.mcard .meta b { color:var(--text2); font-weight:400; }
.mcard .rbar { height:4px; background:var(--panel3); margin-top:10px; }
.mcard .rbar i { display:block; height:100%; background:var(--red); }
.mcard.sm .v { font-size:24px; }
.mcard.sm.emph { border-color:rgba(201,255,63,.4); }
.mcard.sm.emph .v { color:var(--teal-bright); }
@media (max-width:1200px){ .ov-metrics { grid-template-columns:repeat(2,1fr); } .ov-metrics .mcard:first-child { grid-column:1/-1; } }

/* events — full-viewport workflow */
.ev-wrap { display:flex; flex-direction:column; height:100%; }
.ev-bar { display:flex; align-items:center; gap:8px; padding:0 2px 12px; flex-wrap:wrap; }
.ev-tl { position:relative; height:56px; background:var(--panel); border:1px solid var(--line); overflow:hidden; }
.ev-tl svg { display:block; width:100%; height:100%; }
.ev-tl .ev-tick { cursor:pointer; }
.ev-tl .ev-tick:hover { opacity:1 !important; }
.ev-split { display:grid; grid-template-columns:1fr 350px; gap:12px; flex:1; min-height:0; align-items:start; }
.ev-split .panel { margin-bottom:0; }
.evt-row { cursor:pointer; transition:background var(--t-fast); }
.evt-row:hover { background:var(--panel2); }
.evt-row.sel { background:rgba(201,255,63,.06); box-shadow:inset 2px 0 0 var(--teal); }
.evt-row .sev { display:flex; align-items:center; gap:6px; }
.ev-detail .big-msg { font-size:12px; color:var(--text); line-height:1.6; padding:2px 0 8px; }
.ev-detail .rel { border-top:1px solid var(--line); margin-top:4px; padding-top:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
.ev-detail .rel-title { font-family:var(--mono); font-size:8.5px; letter-spacing:1.4px; color:var(--text3); text-transform:uppercase; }
@media (max-width:1100px){ .ev-split { grid-template-columns:1fr; } }

/* model evidence — progressive disclosure */
.me-f { display:flex; flex-direction:column; }

<script>
/* ============================================================
   Netra — pipeline data loader (contract v1)
   Fetches data.json written by the ML pipeline, validates each
   section, and merges over built-in fixtures. Any bad/missing
   section falls back individually — the UI never breaks.
   Provenance is exposed as window.FSDATA.provenance
   { live:bool, source:string, generatedAt:string, errors:[] }.
   ============================================================ */
window.FSLOAD = (function () {
  'use strict';

  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function isStr(v) { return typeof v === 'string' && v.length > 0; }
  function isArr(v) { return Object.prototype.toString.call(v) === '[object Array]'; }
  function isObj(v) { return v && typeof v === 'object' && !isArr(v); }

  var errors = [];

  function warn(msg) { errors.push(msg); }

  /* ---------- section validators: return cleaned value or null ---------- */

  function vOverview(d) {
    if (!isObj(d)) return null;
    var o = {};
    if (isNum(d.observedRisk)) o.observedRisk = clamp01(d.observedRisk);
    if (isNum(d.maxFuture)) o.maxFuture = clamp01(d.maxFuture);
    if (isNum(d.earlyWarning) && d.earlyWarning >= 0) o.earlyWarning = d.earlyWarning;
    if (isStr(d.source)) o.source = d.source;
    if (isNum(d.anomaly)) o.anomaly = d.anomaly;
    if (isNum(d.throughput)) o.throughput = d.throughput;
    if (isStr(d.flows)) o.flows = d.flows;
    if (isStr(d.packets)) o.packets = d.packets;
    if (isStr(d.pipeline)) o.pipeline = d.pipeline;
    if (isNum(d.loss)) o.loss = d.loss;
    if (isNum(d.windowsRetained)) o.windows = d.windowsRetained;
    if (isObj(d.predicted)) {
      var p = {};
      if (isStr(d.predicted.tid)) p.tid = d.predicted.tid;
      if (isStr(d.predicted.name)) p.name = d.predicted.name;
      if (isStr(d.predicted.tactic)) p.tactic = d.predicted.tactic;
      if (isNum(d.predicted.conf)) p.conf = clamp01(d.predicted.conf);
      if (isStr(d.predicted.desc)) p.desc = d.predicted.desc;
      if (Object.keys(p).length) o.predicted = p;
    }
    return Object.keys(o).length ? o : null;
  }

  function vML(d) {
    if (!isObj(d)) return null;
    var m = {};
    if (isStr(d.model)) m.model = d.model;
    if (isStr(d.calibration)) m.calibration = d.calibration;
    if (isNum(d.threshold) && d.threshold > 0 && d.threshold < 1) m.threshold = d.threshold;
    if (isNum(d.features) && d.features > 0) m.features = d.features;
    if (isStr(d.evalProtocol)) m.evalProtocol = d.evalProtocol;
    if (isNum(d.trackB) && d.trackB > 0 && d.trackB <= 100) m.trackB = d.trackB;
    if (isArr(d.early)) {
      var early = [];
      d.early.forEach(function (e) {
        if (isObj(e) && isStr(e.t) && isNum(e.recall) && e.recall > 0 && e.recall <= 100) {
          early.push({ t: e.t, recall: e.recall });
        }
      });
      if (early.length) m.early = early;
    }
    if (isArr(d.final)) {
      var fin = [];
      d.final.forEach(function (e) {
        if (isObj(e) && isStr(e.k) && isStr(e.v)) fin.push({ k: e.k, v: e.v });
      });
      if (fin.length) m.final = fin;
    }
    if (isArr(d.comparison)) {
      var cmp = [];
      d.comparison.forEach(function (e) {
        if (isObj(e) && isStr(e.nm) && isNum(e.f1) && e.f1 > 0 && e.f1 <= 100) {
          cmp.push({ nm: e.nm, f1: e.f1, sel: !!e.sel, why: isStr(e.why) ? e.why : '' });
        }
      });
      if (cmp.length) m.comparison = cmp;
    }
    return Object.keys(m).length ? m : null;
  }

  function vWindows(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    for (var i = 0; i < d.length; i++) {
      var w = d[i];
      if (!isObj(w) || !isNum(w.risk)) { warn('windows[' + i + '] skipped (no risk)'); continue; }
      var risk = clamp01(w.risk);
      out.push({
        i: isNum(w.i) ? w.i : out.length,
        risk: risk,
        peak: isNum(w.peak) ? clamp01(w.peak) : Math.min(0.98, risk + 0.12),
        pps: isNum(w.pps) && w.pps >= 0 ? w.pps : Math.round(900 + risk * 5200),
        flow: isNum(w.flow) && w.flow >= 0 ? w.flow : Math.round(30 + risk * 90),
        alert: typeof w.alert === 'boolean' ? w.alert : risk >= 0.65,
        stage: isStr(w.stage) ? w.stage : '—',
        technique: isStr(w.technique) ? w.technique : '—',
        target: isStr(w.target) ? w.target : '—',
        tsec: isNum(w.tsec) && w.tsec >= 0 ? w.tsec : out.length * 2
      });
    }
    return out.length ? out : null;
  }

  function vHosts(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (h, i) {
      if (!isObj(h) || !isStr(h.id) || !isNum(h.risk)) { warn('hosts[' + i + '] skipped'); return; }
      var state = h.state === 'high' || h.state === 'susp' || h.state === 'norm' ? h.state
        : (h.risk >= 0.65 ? 'high' : h.risk >= 0.45 ? 'susp' : 'norm');
      out.push({
        id: h.id,
        ip: isStr(h.ip) ? h.ip : '—',
        zone: isStr(h.zone) ? h.zone : '—',
        kind: isStr(h.kind) ? h.kind : 'server',
        risk: clamp01(h.risk),
        state: state,
        tech: isStr(h.tech) ? h.tech : '—',
        flows: isNum(h.flows) && h.flows >= 0 ? h.flows : 0
      });
    });
    return out.length ? out : null;
  }

  function vBranches(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (b, i) {
      if (!isObj(b) || !isStr(b.id) || !isNum(b.p)) { warn('branches[' + i + '] skipped'); return; }
      out.push({
        id: b.id,
        p: Math.max(0, Math.min(100, b.p)),
        tid: isStr(b.tid) ? b.tid : '—',
        desc: isStr(b.desc) ? b.desc : '—',
        ttE: isStr(b.ttE) ? b.ttE : '—',
        asset: isStr(b.asset) ? b.asset : '—',
        risk: isNum(b.risk) ? clamp01(b.risk) : 0,
        color: b.color === 'red' || b.color === 'amber' || b.color === 'dim' ? b.color : 'dim'
      });
    });
    return out.length ? out : null;
  }

  function vIncidents(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (n, i) {
      if (!isObj(n) || !isStr(n.id)) { warn('incidents[' + i + '] skipped'); return; }
      out.push({
        id: n.id,
        sev: isStr(n.sev) ? n.sev : 'MED',
        status: n.status === 'TRIAGING' || n.status === 'CONTAINED' || n.status === 'CLOSED' ? n.status : 'TRIAGING',
        tid: isStr(n.tid) ? n.tid : '—',
        tech: isStr(n.tech) ? n.tech : '—',
        target: isStr(n.target) ? n.target : '—',
        ip: isStr(n.ip) ? n.ip : '—',
        peak: isNum(n.peak) ? clamp01(n.peak) : 0,
        lead: isNum(n.lead) && n.lead >= 0 ? n.lead : 0,
        dur: isStr(n.dur) ? n.dur : '—',
        analyst: isStr(n.analyst) ? n.analyst : '—',
        alerts: isNum(n.alerts) ? n.alerts : 0,
        opened: isStr(n.opened) ? n.opened : '—',
        evidence: isNum(n.evidence) ? n.evidence : 0
      });
    });
    return out.length ? out : null;
  }

  function vEvents(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (e, i) {
      if (!isObj(e) || !isStr(e.msg)) { warn('events[' + i + '] skipped'); return; }
      out.push({
        ts: isStr(e.ts) ? e.ts : '—',
        sev: e.sev === 'CRIT' || e.sev === 'WARN' || e.sev === 'INFO' ? e.sev : 'INFO',
        src: isStr(e.src) ? e.src : 'system',
        host: isStr(e.host) ? e.host : '—',
        msg: e.msg
      });
    });
    return out.length ? out : null;
  }

  function vPredictions(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (p, i) {
      if (!isObj(p) || !isStr(p.tid) || !isNum(p.p)) { warn('predictions[' + i + '] skipped'); return; }
      out.push({
        tid: p.tid,
        name: isStr(p.name) ? p.name : p.tid,
        p: clamp01(p.p),
        eta: isStr(p.eta) ? p.eta : '—',
        conf: isStr(p.conf) ? p.conf : (isNum(p.conf) ? String(p.conf) : '—')
      });
    });
    return out.length ? out : null;
  }

  function vStateVector(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (r, i) {
      if (!isObj(r) || !isStr(r.nm) || !isNum(r.v)) { warn('stateVector[' + i + '] skipped'); return; }
      out.push({ nm: r.nm, v: clamp01(r.v), hot: !!r.hot });
    });
    return out.length ? out : null;
  }

  function vAttack(d) {
    if (!isArr(d) || !d.length) return null;
    var out = [];
    d.forEach(function (t, i) {
      if (!isObj(t) || !isStr(t.tactic) || !isArr(t.items)) { warn('attack[' + i + '] skipped'); return; }
      var items = [];
      t.items.forEach(function (it) {
        if (isObj(it) && isStr(it.id) && isStr(it.name)) {
          items.push({
            id: it.id, name: it.name,
            state: it.state === 'hot' || it.state === 'warm' ? it.state : '',
            p: isNum(it.p) ? clamp01(it.p) : 0
          });
        }
      });
      if (items.length) out.push({ tactic: t.tactic, items: items });
    });
    return out.length ? out : null;
  }

  function vCampaign(d) {
    if (!isObj(d)) return null;
    var c = {};
    if (isStr(d.id)) c.id = d.id;
    if (isStr(d.started)) c.started = d.started;
    if (isNum(d.hosts)) c.hosts = d.hosts;
    if (isNum(d.flows)) c.flows = d.flows;
    if (isNum(d.alerts)) c.alerts = d.alerts;
    if (isArr(d.stages)) {
      var st = [];
      d.stages.forEach(function (s) {
        if (isObj(s) && isStr(s.nm)) st.push({ nm: s.nm, ts: isStr(s.ts) ? s.ts : '—', done: !!s.done, tid: isStr(s.tid) ? s.tid : '—' });
      });
      if (st.length) c.stages = st;
    }
    return Object.keys(c).length ? c : null;
  }

  /* ---------- merge + boot ---------- */

  function merge(fix, live) {
    /* [FSDATA key, contract key (data.json), validator] */
    var map = [
      ['OVERVIEW',    'overview',    vOverview],
      ['ML',          'ml',          vML],
      ['windows',     'windows',     vWindows],   /* data.js uses lowercase here */
      ['HOSTS',       'hosts',       vHosts],
      ['BRANCHES',    'branches',    vBranches],
      ['INCIDENTS',   'incidents',   vIncidents],
      ['EVENTS',      'events',      vEvents],
      ['PREDICTIONS', 'predictions', vPredictions],
      ['STATE_VECTOR', 'stateVector', vStateVector],
      ['ATTACK',      'attack',      vAttack],
      ['CAMPAIGN',    'campaign',    vCampaign]
    ];
    var out = {};
    /* always seed from the pristine fixture snapshot — never from current
       FSDATA, which live polls may have overwritten (so a later poll can
       still fall back cleanly when a section disappears or turns invalid) */
    var base = fix.FIXTURES || fix;
    map.forEach(function (m) { out[m[0]] = base[m[0]]; });
    var applied = 0;
    map.forEach(function (m) {
      var fkey = m[0], lkey = m[1], validate = m[2];
      if (live && (lkey in live)) {
        var v = validate(live[lkey]);
        if (v != null) { out[fkey] = v; applied++; }
        else warn('section "' + lkey + '" invalid — using fixture');
      }
    });
    return { data: out, applied: applied };
  }

  var booted = false;
  var pollTimer = null;
  var POLL_MS = 30000;
  var lastSnapshot = null;   /* JSON of last applied merged data (change detection) */

  function applyDoc(doc) {
    var F = window.FSDATA;
    if (!isObj(doc)) throw new Error('not an object');
    errors.length = 0; /* per-apply warnings, not cumulative across polls */
    if (isObj(doc.meta) && doc.meta.schema_version !== 1) {
      warn('schema_version ' + doc.meta.schema_version + ' — attempting v1 parse');
    }
    var res = merge(F, doc);
    var snapshot = JSON.stringify(res.data);
    var changed = snapshot !== lastSnapshot;
    /* apply the merged document onto FSDATA in place (app.js holds a
       reference to this object, so reassignment would be invisible) */
    Object.keys(res.data).forEach(function (k) { F[k] = res.data[k]; });
    F.provenance = {
      live: true,
      source: isObj(doc.meta) && isStr(doc.meta.source) ? doc.meta.source : 'pipeline',
      generatedAt: isObj(doc.meta) && isStr(doc.meta.generated_at) ? doc.meta.generated_at : '—',
      sections: res.applied,
      errors: errors
    };
    if (errors.length) console.warn('[FSLOAD] fallbacks applied:', errors.join('; '));
    console.info('[FSLOAD] live data: ' + res.applied + ' sections from ' + F.provenance.source);
    lastSnapshot = snapshot;
    return changed;
  }

  function failToFixtures(e) {
    window.FSDATA.provenance = { live: false, source: 'built-in fixtures', generatedAt: '—', sections: 0, errors: errors };
    console.info('[FSLOAD] no pipeline data (' + e.message + ') — running on fixtures');
  }

  function emitChange(kind) {
    try {
      /* dispatched on document: reaches document listeners (app.js) and
         bubbles to window listeners; a window dispatch would do neither */
      document.dispatchEvent(new CustomEvent('fs:data', {
        detail: { kind: kind, provenance: window.FSDATA.provenance }
      }));
    } catch (e) { /* very old browsers: next poll still updates data */ }
  }

  function fetchDoc(initial) {
    return fetch('data.json', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (doc) {
        var changed = applyDoc(doc);
        if (!initial && changed) emitChange('update');
      })
      .catch(function (e) {
        if (!initial && window.FSDATA.provenance && window.FSDATA.provenance.live) {
          /* transient poll failure: keep last good data + provenance */
          console.warn('[FSLOAD] poll failed, keeping last good data (' + e.message + ')');
        } else {
          failToFixtures(e);
        }
      });
  }

  function boot() {
    if (booted) return;
    booted = true;
    fetchDoc(true).finally(function () {
      window.FSBOOT && window.FSBOOT();
      startPolling();
    });
  }

  function tick() {
    if (document.hidden) return; /* skip polls while the tab is hidden */
    fetchDoc(false);
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(tick, POLL_MS);
    document.addEventListener('visibilitychange', function () {
      /* catch up immediately when the tab becomes visible again */
      if (!document.hidden && booted) fetchDoc(false);
    });
  }

  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  /* auto-boot: loader loads before app.js registers FSBOOT, so defer to
     DOMContentLoaded — by then all four scripts have executed. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  return { boot: boot, refresh: function () { return fetchDoc(false); }, startPolling: startPolling, stopPolling: stopPolling };
})();
