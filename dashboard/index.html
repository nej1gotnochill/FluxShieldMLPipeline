<script>
/* ============================================================
   Netra — SVG helpers + chart renderers (flat, thin, dark)
   ============================================================ */
window.FS = (function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  var LIVE = [];
  function registerLive(svg){ if (LIVE.indexOf(svg)<0) LIVE.push(svg); }
  var MONO = "'IBM Plex Mono', monospace";
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function div(cls, html) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    if (html != null) d.innerHTML = html;
    return d;
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fmt(n, d) { return Number(n).toFixed(d == null ? 3 : d); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function secOfDay(s) { return pad2(Math.floor(s / 3600) % 24) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60); }

  /* risk color ladder (flat) */
  function riskColor(r) {
    if (r >= 0.65) return '#E15252';
    if (r >= 0.45) return '#E0A84A';
    if (r >= 0.20) return '#A8ADA5';
    return '#A8D93F';
  }
  function riskState(r) {
    if (r >= 0.65) return 'HIGH';
    if (r >= 0.45) return 'ELEV';
    if (r >= 0.20) return 'GUARDED';
    return 'NOMINAL';
  }

  /* ---------- line/area series chart ---------- */
  /* cfg: {w,h,obs:[],fore:[],peak:[],band:[],threshold,xLabels:[],nowIndex,yMax, colors:{}} */
  function seriesChart(cfg) {
    var w = cfg.w || 640, h = cfg.h || 190;
    var mL = 34, mR = 10, mT = 10, mB = cfg.xLabels ? 20 : 8;
    var iw = w - mL - mR, ih = h - mT - mB;
    var svg = el('svg', { viewBox: '0 0 ' + w + ' ' + h, preserveAspectRatio: 'none' });
    svg.classList.add('chart');
    var yMax = cfg.yMax || 1;
    var n = (cfg.obs ? cfg.obs.length : 0);
    if (!n) return svg;
    var total = cfg.foreAppend ? n + cfg.foreAppend : n;
    function X(i) { return mL + (i / (total - 1)) * iw; }
    function Y(v) { return mT + (1 - v / yMax) * ih; }

    /* teal live dot that rides the observed trace */
    if (cfg.live !== false) {
      var dot = el('circle', { r: 2.6, fill: '#C9FF3F', opacity: '0.9' }, svg);
      registerLive({ svg: svg, dot: dot, cfg: cfg, X: X, Y: Y, mL: mL });
    }

    /* y grid */
    var steps = [0, 0.25, 0.5, 0.75, 1];
    steps.forEach(function (v) {
      var y = Y(v * yMax);
      el('line', { x1: mL, x2: w - mR, y1: y, y2: y, stroke: v === 0 ? '#222522' : 'rgba(244,245,241,.05)', 'stroke-width': 1 }, svg);
      var t = el('text', { x: mL - 5, y: y + 3, 'text-anchor': 'end', 'font-size': 8, fill: '#565B54', 'font-family': MONO }, svg);
      t.textContent = String(v);
    });

    /* threshold */
    if (cfg.threshold != null) {
      var ty = Y(cfg.threshold);
      el('line', { x1: mL, x2: w - mR, y1: ty, y2: ty, stroke: '#E15252', 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: .8 }, svg);
      var tt = el('text', { x: mL + 4, y: ty - 3, 'font-size': 8, fill: '#737871', 'font-family': MONO }, svg);
      tt.textContent = 'THRESHOLD ' + fmt(cfg.threshold, 2);
    }

    /* forecast band */
    if (cfg.band && cfg.foreAppend) {
      var pts = '';
      for (var i = 0; i < cfg.foreAppend; i++) {
        var bi = n + i;
        if (bi === n) pts = 'M' + X(bi) + ',' + Y(cfg.band[i][0]);
        else pts += ' L' + X(bi) + ',' + Y(cfg.band[i][0]);
      }
      for (var j = cfg.foreAppend - 1; j >= 0; j--) {
        pts += ' L' + X(n + j) + ',' + Y(cfg.band[j][1]);
      }
      el('path', { d: pts, fill: 'rgba(201,255,63,.09)', stroke: 'none', opacity: .95 }, svg);
    }

    /* observed area + line (sand) */
    function pathOf(arr, from) {
      var d = '';
      for (var i = from || 0; i < arr.length; i++) d += (i === (from || 0) ? 'M' : 'L') + X(i) + ',' + Y(arr[i]);
      return d;
    }
    if (cfg.area !== false) {
      var area = pathOf(cfg.obs) + ' L' + X(n - 1) + ',' + Y(0) + ' L' + X(0) + ',' + Y(0) + ' Z';
      el('path', { d: area, fill: 'rgba(201,255,63,.07)', opacity: 1, stroke: 'none' }, svg);
    }
    el('path', { d: pathOf(cfg.obs), fill: 'none', stroke: cfg.cObs || '#D6DAD2', 'stroke-width': 1.4 }, svg);

    /* forecast peak (dashed) — teal */
    if (cfg.peak) {
      var pk = cfg.obs.concat(cfg.peak);
      var d2 = '';
      for (var k = 0; k < pk.length; k++) {
        if (k < n - 1 && !cfg.foreFrom) continue;
        d2 += (d2 === '' ? 'M' : 'L') + X(k) + ',' + Y(pk[k]);
      }
      if (cfg.foreFrom != null) {
        d2 = '';
        for (var m = cfg.foreFrom; m < pk.length; m++) d2 += (d2 === '' ? 'M' : 'L') + X(m) + ',' + Y(pk[m]);
      }
      el('path', { d: d2, fill: 'none', stroke: '#C9FF3F', 'stroke-width': 1, 'stroke-dasharray': '4 3', opacity: .8 }, svg);
    }
    if (cfg.fore) {
      var d3 = '';
      for (var f = 0; f < cfg.fore.length; f++) d3 += (f === 0 ? 'M' : 'L') + X(n - 1 + f) + ',' + Y(cfg.fore[f]);
      /* connect */
      el('path', { d: 'M' + X(n - 1) + ',' + Y(cfg.obs[n - 1]) + ' ' + d3.replace('M', 'L'), fill: 'none', stroke: cfg.cFore || '#C9FF3F', 'stroke-width': 1, 'stroke-dasharray': '2 3' }, svg);
    }

    /* NOW divider */
    if (cfg.nowIndex != null) {
      el('line', { x1: X(cfg.nowIndex), x2: X(cfg.nowIndex), y1: mT, y2: mT + ih, stroke: '#F4F5F1', 'stroke-width': 1, opacity: .7 }, svg);
    }
    /* vertical gridlines */
    if (cfg.vgrid) {
      for (var g = 0; g < cfg.vgrid.length; g++) {
        var gi = cfg.vgrid[g];
        el('line', { x1: X(gi), x2: X(gi), y1: mT, y2: mT + ih, stroke: '#0A0C0A', 'stroke-width': 1 }, svg);
      }
    }

    /* x labels */
    if (cfg.xLabels) {
      cfg.xLabels.forEach(function (lb) {
        var t = el('text', { x: X(lb.i), y: h - 5, 'text-anchor': lb.anchor || 'middle', 'font-size': 8, fill: '#565B54', 'font-family': MONO }, svg);
        t.textContent = lb.t;
      });
    }

    /* hover crosshair: vertical line + value flag, follows mouse */
    if (cfg.hover !== false && cfg.obs) {
      var xh = el('line', { y1: mT, y2: mT + ih, stroke: 'rgba(244,245,241,.28)', 'stroke-width': 1, visibility: 'hidden' }, svg);
      var xhc = el('circle', { r: 3, fill: '#D7FF63', stroke: '#050706', 'stroke-width': 1, visibility: 'hidden' }, svg);
      var xht = el('text', { 'font-size': 8.5, fill: '#F4F5F1', 'font-family': MONO, visibility: 'hidden' }, svg);
      var xhb = el('rect', { height: 14, fill: '#111312', stroke: '#292C29', visibility: 'hidden' }, svg);
      var bandRect = el('rect', { x: mL, y: mT, width: iw, height: ih, fill: 'transparent' }, svg);
      svg.insertBefore(bandRect, svg.firstChild.nextSibling || svg.firstChild);
      function onMove(ev) {
        var r = svg.getBoundingClientRect();
        var fx = (ev.clientX - r.left) / r.width * w;
        if (fx < mL || fx > w - mR) { return; }
        var fi = (fx - mL) / iw * (total - 1);
        var i0 = Math.max(0, Math.min(n - 1, Math.floor(fi)));
        var v = cfg.obs[i0];
        if (v == null) return;
        var px = X(i0), py = Y(v);
        xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
        xhc.setAttribute('cx', px); xhc.setAttribute('cy', py); xhc.setAttribute('visibility', 'visible');
        var lblStr = (cfg.xLabels && cfg.xLabels.length) ? (cfg.xLabels.reduce(function (a, b) { return Math.abs(b.i - i0) < Math.abs(a.i - i0) ? b : a; }).t) : ('w' + (i0 + 1));
        var txt = lblStr + '  ·  ' + fmt(v, 3);
        xht.textContent = txt; xht.setAttribute('visibility', 'visible');
        var tw2 = txt.length * 5.2 + 10;
        var tx = Math.min(w - mR - tw2, Math.max(mL, px + 6));
        xhb.setAttribute('x', tx); xhb.setAttribute('y', mT + 2); xhb.setAttribute('width', tw2); xhb.setAttribute('visibility', 'visible');
        xht.setAttribute('x', tx + 5); xht.setAttribute('y', mT + 12);
      }
      function onLeave() {
        [xh, xhc, xht, xhb].forEach(function (e2) { e2.setAttribute('visibility', 'hidden'); });
      }
      bandRect.addEventListener('mousemove', onMove);
      bandRect.addEventListener('mouseleave', onLeave);
    }
    return svg;
  }

  /* ---------- mini lattice (hatched future bars) ---------- */
  function lattice(n, hotIdx) {
    var g = div('rp-lattice');
    for (var i = 0; i < n; i++) {
      var b = document.createElement('i');
      if (hotIdx && hotIdx.indexOf(i) >= 0) b.style.borderColor = '#E15252';
      g.appendChild(b);
    }
    return g;
  }

  /* ---------- live tick: ride dots + risk sweep ---------- */
  setInterval(function () {
    if (document.hidden) return;
    var now = performance.now() / 1000;
    LIVE = LIVE.filter(function (L) { return L.svg.isConnected; });
    LIVE.forEach(function (L) {
      var n = L.cfg.obs.length;
      var total = L.cfg.foreAppend ? n + L.cfg.foreAppend : n;
      var phase = (now * 0.14) % 1;
      var fi = phase * (total - 1);
      var i0 = Math.min(n - 1, Math.floor(fi));
      var fr = fi - i0;
      var arr = L.cfg.obs;
      var v = i0 < n - 1 ? (arr[i0] + (arr[i0 + 1] - arr[i0]) * fr) : arr[n - 1];
      var x = L.mL + (fi / (total - 1)) * (L.svg.viewBox.baseVal.width - L.mL - 10);
      var y = L.Y(v);
      L.dot.setAttribute('cx', x);
      L.dot.setAttribute('cy', y);
      var pulse = 0.55 + 0.45 * Math.sin(now * 2.4);
      L.dot.setAttribute('opacity', (0.35 + pulse * 0.55).toFixed(2));
    });
  }, 90);

  return {
    el: el, div: div, esc: esc, fmt: fmt, secOfDay: secOfDay,
    riskColor: riskColor, riskState: riskState,
    seriesChart: seriesChart, lattice: lattice
  };
})();

    ctx.moveTo(x, y - h - dy); ctx.lineTo(x + s, y - h); ctx.lineTo(x, y - h + dy); ctx.lineTo(x - s, y - h);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = col;
    ctx.fillRect(x - 1.5, y - h - 1.5, 3, 3);
    if (sel) {
      ctx.strokeStyle = '#F4F5F1'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y - h - dy - 4); ctx.lineTo(x + s + 4, y - h); ctx.lineTo(x, y - h + dy + 4); ctx.lineTo(x - s - 4, y - h);
      ctx.closePath(); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  var FIELD_COLORS = { n: 'rgba(201,255,63,.55)', warm: 'rgba(224,168,74,.85)', hot: 'rgba(225,82,82,.9)', tap: 'rgba(201,255,63,.45)' };
  var fieldRAF = null;
  /* selection + living density: calm when healthy, busier under attack */
  var fieldSel = null, fieldGeom = null, fieldTarget = 42;
  function fieldNeighbors(id) {
    var set = {};
    FIELD_LINKS.forEach(function (lk) {
      if (lk[0] === id) set[lk[1]] = 1;
      if (lk[1] === id) set[lk[0]] = 1;
    });
    return set;
  }
  function fieldPick(mx, my) {
    if (!fieldGeom) return;
    var best = null, bd = 1e9;
    FIELD_ZONES.forEach(function (z) {
      z.hosts.forEach(function (h) {
        var p = fieldPos(h.id); if (!p) return;
        var q = fieldProj(p.x, p.y, fieldGeom);
        var x = q.x, y = q.y;
        var d = (x - mx) * (x - mx) + (y - my) * (y - my);
        if (d < bd) { bd = d; best = h.id; }
      });
    });
    if (best && bd < 400) {
      fieldSel = (fieldSel === best) ? null : best;
      updateFieldCtx();
    }
  }
  function updateFieldCtx() {
    var elc = document.getElementById('ovFieldCtx');
    if (!elc) return;
    if (!fieldSel) {
      elc.innerHTML = '<span class="fc-k">FIELD</span><span class="fc-v">Select a node for host context.</span><span class="fc-x">click again to clear</span>';
      return;
    }
    var h = D.HOSTS.filter(function (x) { return x.id === fieldSel; })[0];
    if (h) {
      elc.innerHTML = '<span class="fc-k">HOST</span>' +
        '<span class="fc-v"><b>' + esc(h.id) + '</b> · <span class="mono-ip">' + esc(h.ip) + '</span> · ' + esc(h.zone) +
        ' · risk <b style="color:' + FS.riskColor(h.risk) + '">' + fmt(h.risk) + '</b> · ' + h.flows + ' flows · ' + esc(h.tech) + '</span>' +
        '<span class="fc-x">' + FS.riskState(h.risk) + ' · click again to clear</span>';
    } else if (fieldSel === 'tap') {
      elc.innerHTML = '<span class="fc-k">SENSOR</span>' +
        '<span class="fc-v"><b>tap</b> · one-way mirror — reads SPAN/TAP, never injects traffic</span>' +
        '<span class="fc-x">passive · click again to clear</span>';
    } else {
      elc.innerHTML = '<span class="fc-k">NODE</span>' +
        '<span class="fc-v"><b>' + esc(fieldSel) + '</b> · external — outside the monitoring boundary</span>' +
        '<span class="fc-x">unmonitored · click again to clear</span>';
    }
  }
  function fieldDraw(now) {
    fieldRAF = null;
    var host = document.getElementById('ovField');
    if (!host || !host.isConnected) return;
    var canvas = host.querySelector('canvas');
    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
      host.appendChild(canvas);
    }
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var r = host.getBoundingClientRect();
    var W = r.width, H = Math.max(300, Math.min(430, r.height));
    if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) {
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    host.style.height = H + 'px';
    var px = 64, py = 46;
    var gw = W - px * 2, gh = H - py * 2;
    function P(n) { var p = fieldPos(n); return fieldProj(p.x, p.y, fieldGeom); }
    var t = (now - fieldT0) / 1000;
    fieldGeom = { px: px, py: py, gw: gw, gh: gh, W: W, H: H };
    /* traffic density follows threat level */
    var maxRisk = 0;
    D.HOSTS.forEach(function (h) { if (h.risk > maxRisk) maxRisk = h.risk; });
    fieldTarget = 30 + Math.round(maxRisk * 26);
    while (packets.length < fieldTarget) fieldSpawn();
    /* iso ground grid + zone rails + labels */
    ctx.font = '8.5px \'IBM Plex Mono\', monospace'; ctx.textAlign = 'center';
    [0.25, 0.5, 0.75].forEach(function (v) {
      var a = fieldProj(0.02, v, fieldGeom), b2 = fieldProj(0.98, v, fieldGeom);
      ctx.strokeStyle = 'rgba(244,245,241,.045)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
    });
    FIELD_ZONES.forEach(function (z) {
      var a = fieldProj(z.fx, -0.04, fieldGeom), b2 = fieldProj(z.fx, 1.02, fieldGeom);
      ctx.strokeStyle = 'rgba(201,255,63,.08)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      var lp = fieldProj(z.fx, -0.04, fieldGeom);
      ctx.fillStyle = 'rgba(111,125,122,.85)';
      ctx.fillText(z.nm, lp.x, lp.y - 12);
    });
    /* links — a selected node highlights its edges; everything else recedes */
    var nbrs = fieldSel ? fieldNeighbors(fieldSel) : null;
    FIELD_LINKS.forEach(function (lk) {
      var a = P(lk[0]), b = P(lk[1]);
      var on = nbrs && (lk[0] === fieldSel || lk[1] === fieldSel);
      var dim = nbrs && !on;
      var col = lk[2] === 'hot' ? 'rgba(225,82,82,.5)' : lk[2] === 'warm' ? 'rgba(224,168,74,.4)' : lk[2] === 'tap' ? 'rgba(201,255,63,.2)' : 'rgba(201,255,63,.15)';
      if (on) col = col.replace(/,[0-9.]+\)/, ',.85)');
      if (dim) col = col.replace(/,[0-9.]+\)/, ',.06)');
      ctx.strokeStyle = col; ctx.lineWidth = on ? 1.8 : (dim ? 1 : (lk[2] === 'hot' ? 1.6 : 1));
      ctx.setLineDash(lk[2] === 'tap' ? [2, 4] : []);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]);
    });
    /* packets */
    packets.forEach(function (pk) {
      pk.t += pk.sp / 60;
      if (pk.t >= 1) { pk.t = 0; fieldSpawn(); packets.shift(); }
      var a = P(pk.lk[0]), b = P(pk.lk[1]);
      var x = a.x + (b.x - a.x) * pk.t, y = a.y + (b.y - a.y) * pk.t;
      ctx.fillStyle = FIELD_COLORS[pk.cls] || FIELD_COLORS.n;
      var s = pk.cls === 'hot' ? 2.6 : 1.8;
      ctx.beginPath();
      ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y);
      ctx.closePath(); ctx.fill();
    });
    /* nodes — isometric cubes */
    FIELD_ZONES.forEach(function (z) {
      z.hosts.forEach(function (h) {
        var p = P(h.id);
        var col = h.cls === 'hot' ? '#E15252' : h.cls === 'warm' ? '#E0A84A' : h.cls === 'crit' ? '#E15252' : h.cls === 'tap' ? '#C9FF3F' : '#C9FF3F';
        var isSel = fieldSel === h.id;
        var linked = nbrs && nbrs[h.id];
        var alpha = (fieldSel && !isSel && !linked) ? 0.3 : 1;
        var pulse = (h.cls === 'hot' || h.cls === 'crit') ? (Math.sin(t * 2.2 + p.y * 9) * 0.5 + 0.5) * 0.4 + 0.75 : 1;
        drawIsoCube(ctx, p.x, p.y, col, isSel, alpha * pulse);
        ctx.font = '8.5px \'IBM Plex Mono\', monospace'; ctx.textAlign = 'center';
        ctx.globalAlpha = alpha;
        ctx.fillStyle = isSel ? '#F4F5F1' : h.cls === 'hot' ? '#E15252' : h.cls === 'warm' ? '#E0A84A' : 'rgba(166,179,176,.8)';
        ctx.fillText(h.id, p.x, p.y + 15);
        ctx.globalAlpha = 1;
      });
    });
    /* hud */
    ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(201,255,63,.55)';
    var activeHot = packets.filter(function (p) { return p.cls === 'hot'; }).length;
    ctx.font = '8.5px \'IBM Plex Mono\', monospace';
    ctx.fillText('THREAT FLOWS ' + String(activeHot).padStart(2, '0'), px, H - py + 24);
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(111,125,122,.8)';
    ctx.fillText('T+' + Math.floor(t) + 's', W - px, H - py + 24);
    if (!fieldRAF) fieldRAF = requestAnimationFrame(fieldDraw);
  }
  /* restart loop whenever overview renders */
  var _origRender = renderScreen;
  renderScreen = function () { _origRender(); if (S.screen === 'overview' && !fieldRAF) fieldRAF = requestAnimationFrame(fieldDraw); };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /* ---- live polling updates (fired by loader after a changed re-fetch) ---- */
  document.addEventListener('fs:data', function (ev) {
    var d = ev.detail || {};
    /* keep replay position inside the (possibly smaller) live window set */
    var wn = (D.windows || []).length;
    if (wn > 0) {
      S.replay.t = Math.min(S.replay.t, wn - 1);
      S.replay.selWindow = Math.min(S.replay.selWindow, wn - 1);
    }
    renderProvenance();
    /* re-render the current screen so it reflects the new pipeline data */
    renderScreen();
    if (S.screen !== 'overview') {
      var pr = d.provenance || D.provenance || {};
      toast('Pipeline data updated', (pr.sections || 0) + ' sections · ' + (pr.generatedAt || '—'), '');
    }
  });

  /* boot is invoked by the loader after data.json merge attempt */
  window.FSBOOT = boot;
})();

</script>
